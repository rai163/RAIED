<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expandable Single Sheet Shutters and Spaces with Toggle</title>
<style>
  :root {
    --bg: #eef3f7;
    --panel: #ffffff;
    --ink: #17324a;
    --muted: #667788;
    --line: #d7e0e8;
    --blue: #1f5fb8;
    --red: #d34b43;
    --shadow: 0 10px 30px rgba(10, 30, 50, 0.08);
    --radius: 16px;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #f4f7fa 0%, #e9f0f5 100%);
    color: #1f2933;
    padding: 24px;
    user-select: none;
  }
  h1 {
    margin: 0 0 18px;
    color: var(--ink);
    font-size: clamp(1.8rem, 2.5vw, 2.8rem);
  }
  .layout-container {
    max-width: 1000px;
    margin: 0 auto;
  }
  .defense-line {
    position: relative;
    display: flex;
    align-items: center;
    height: 80px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    overflow-x: auto;
    padding: 10px;
    padding-right: 60px; /* Allow last item expansion */
    gap: 6px;
    margin-bottom: 20px;
  }
  .segment {
    position: relative;
    height: 60px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: 700;
    font-size: 0.85rem;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    user-select: none;
    cursor: grab;
    transition: box-shadow 0.2s ease;
    white-space: pre-line;
    min-width: 24px;
  }
  .segment.dragging {
    opacity: 0.7;
    box-shadow: 0 0 15px 5px rgba(31, 95, 184, 0.5);
    cursor: grabbing;
    z-index: 1000;
  }
  .segment.shutter {
    background: linear-gradient(135deg, var(--blue), #164a8a);
  }
  .segment.gap {
    background: linear-gradient(135deg, #94a3b8, #cbd5e1);
    color: #334155;
    font-weight: 600;
    cursor: default;
    user-select: none;
  }
  .segment.layer {
    background: linear-gradient(135deg, var(--red), #a8322f);
    cursor: default;
  }
  .tooltip {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2937dd;
    color: white;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 20;
  }
  .segment:hover .tooltip {
    opacity: 1;
  }
  .resize-handle {
    position: absolute;
    top: 0;
    right: 0;
    width: 8px;
    height: 100%;
    cursor: ew-resize;
    background: transparent;
    z-index: 10;
  }
  .resize-handle:hover {
    background: rgba(0, 0, 0, 0.1);
  }
  .controls {
    margin-top: 10px;
    max-width: 1000px;
    margin-left: auto;
    margin-right: auto;
  }
  .control-group {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
    align-items: center;
  }
  .control {
    flex: 1 1 180px;
    display: flex;
    flex-direction: column;
  }
  label {
    font-weight: 600;
    margin-bottom: 6px;
    color: #334155;
  }
  input[type=number],
  select {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 1rem;
  }
  button {
    padding: 14px 20px;
    font-size: 1.1rem;
    font-weight: 700;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(31, 95, 184, 0.3);
    transition: background-color 0.3s ease;
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
    display: block;
  }
  button:hover {
    background: #164a8a;
  }
  /* Align checkbox label nicely */
  .checkbox-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    margin-bottom: 24px;
  }
  .checkbox-control label {
    margin: 0;
    font-weight: 600;
    cursor: pointer;
  }
  @media (max-width: 600px) {
    .segment {
      height: 50px;
      font-size: 0.7rem;
    }
    .control-group {
      flex-direction: column;
      align-items: flex-start;
    }
    .control {
      width: 100%;
    }
  }
</style>
</head>
<body>

<h1>Expandable Single Sheet Shutters and Spaces with Toggle</h1>

<div class="layout-container">
  <div class="defense-line" id="defenseLine" aria-label="Defense system layout"></div>

  <div class="controls">
    <div class="control-group">
      <div class="control">
        <label for="shutterCount">Number of Single SS Shutters (0-5)</label>
        <select id="shutterCount">
          <option value="0" selected>0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

      <div class="control">
        <label for="shutterThickness">Default Shutter Thickness (mm, 4-30)</label>
        <input type="number" id="shutterThickness" min="4" max="30" step="1" value="8" />
      </div>

      <div class="control checkbox-control">
        <input type="checkbox" id="showShutterSpaces" checked />
        <label for="showShutterSpaces">Show spaces between shutters</label>
      </div>

      <div class="control">
        <label for="shutterGap">Space Between Shutters (mm, 50-2500)</label>
        <input type="number" id="shutterGap" min="50" max="2500" step="50" value="500" />
      </div>
    </div>

    <div class="control-group">
      <div class="control">
        <label for="airGap">Internal Air Gap in Each Layer (mm, 500-2500)</label>
        <input type="number" id="airGap" min="500" max="2500" step="50" value="1000" />
      </div>
      <div class="control">
        <label for="gap12">Space Between Layer 1 and 2 (mm, 50-5000)</label>
        <input type="number" id="gap12" min="50" max="5000" step="50" value="2000" />
      </div>
      <div class="control">
        <label for="gap23">Space Between Layer 2 and 3 (mm, 50-5000)</label>
        <input type="number" id="gap23" min="50" max="5000" step="50" value="2000" />
      </div>
    </div>

    <div class="control-group">
      <div class="control">
        <label for="alphaShutter">Single SS Shutter Base Absorption (0-1)</label>
        <input type="number" id="alphaShutter" min="0" max="1" step="0.01" value="0.08" />
      </div>
      <div class="control">
        <label for="alpha1">Layer 1 Base Absorption (0-1)</label>
        <input type="number" id="alpha1" min="0" max="1" step="0.01" value="0.90" />
      </div>
      <div class="control">
        <label for="alpha2">Layer 2 Base Absorption (0-1)</label>
        <input type="number" id="alpha2" min="0" max="1" step="0.01" value="0.30" />
      </div>
      <div class="control">
        <label for="alpha3">Layer 3 Base Absorption (0-1)</label>
        <input type="number" id="alpha3" min="0" max="1" step="0.01" value="0.10" />
      </div>
    </div>

    <div class="control-group">
      <div class="control">
        <label for="mass">Mass (kg)</label>
        <input type="number" id="mass" min="1" max="100" step="1" value="20" />
      </div>
      <div class="control">
        <label for="velocity">Velocity (m/s)</label>
        <input type="number" id="velocity" min="1" max="1000" step="1" value="250" />
      </div>
    </div>

    <button id="runBtn">Update Layout & Simulation</button>
  </div>
</div>

<script>
  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function createSegment({id, type, label, size, tooltip, draggable, resizable}) {
    const seg = document.createElement('div');
    seg.className = `segment ${type}`;
    if (draggable) seg.setAttribute('draggable', 'true');
    if (id) seg.id = id;

    let widthPx = 0;
    if (type === 'gap' || type === 'layer') {
      widthPx = size * 0.08;
    } else if (type === 'shutter') {
      widthPx = size * 4;
    }
    widthPx = Math.max(widthPx, 24);
    seg.style.width = `${widthPx}px`;
    seg.textContent = label;

    const tip = document.createElement('div');
    tip.className = 'tooltip';
    tip.textContent = tooltip;
    seg.appendChild(tip);

    if (resizable) {
      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      seg.appendChild(handle);
      handle.addEventListener('mousedown', e => initResize(e, seg));
    }

    return seg;
  }

  let dragged = null;

  function onDragStart(e) {
    dragged = e.currentTarget;
    dragged.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
  }

  function onDragEnd(e) {
    if (dragged) {
      dragged.classList.remove('dragging');
      snapDragged(dragged);
      dragged = null;
    }
  }

  function snapDragged(element) {
    const container = element.parentNode;
    const segments = Array.from(container.children).filter(s => s.classList.contains('segment'));
    const elemRect = element.getBoundingClientRect();
    const elemCenterX = elemRect.left + elemRect.width / 2;

    let closest = null;
    let closestDist = Infinity;
    for (const seg of segments) {
      if (seg === element) continue;
      const r = seg.getBoundingClientRect();
      const centerX = r.left + r.width / 2;
      const dist = Math.abs(centerX - elemCenterX);
      if (dist < closestDist) {
        closestDist = dist;
        closest = seg;
      }
    }

    if (closest) {
      const containerChildren = Array.from(container.children);
      const draggedIndex = containerChildren.indexOf(element);
      const closestIndex = containerChildren.indexOf(closest);
      if (elemCenterX < closest.getBoundingClientRect().left + closest.offsetWidth / 2) {
        if (draggedIndex > closestIndex) {
          container.insertBefore(element, closest);
        }
      } else {
        if (draggedIndex < closestIndex) {
          container.insertBefore(element, closest.nextSibling);
        }
      }
    }
    element.style.position = '';
    element.style.left = '';
    element.style.zIndex = '';
  }

  function onDragOver(e) {
    e.preventDefault();
  }

  let resizing = null;
  let startX = 0;
  let startWidth = 0;

  function initResize(e, segment) {
    e.preventDefault();
    resizing = segment;
    startX = e.clientX;
    startWidth = resizing.offsetWidth;
    document.addEventListener('mousemove', doResize);
    document.addEventListener('mouseup', stopResize);
  }

  function doResize(e) {
    if (!resizing) return;
    const dx = e.clientX - startX;
    let newWidth = startWidth + dx;
    newWidth = Math.max(newWidth, 24);

    const type = resizing.classList.contains('gap') ? 'gap' : resizing.classList.contains('layer') ? 'layer' : 'shutter';

    if (type === 'gap' || type === 'layer') {
      const minWidth = 50 * 0.08;
      const maxWidth = 5000 * 0.08;
      newWidth = Math.min(Math.max(newWidth, minWidth), maxWidth);
      resizing.style.width = `${newWidth}px`;
      resizing.dataset.size = newWidth / 0.08;
      resizing.textContent = `${Math.round(resizing.dataset.size)} mm`;
    } else if (type === 'shutter') {
      const minWidth = 4 * 4;
      const maxWidth = 30 * 4;
      newWidth = Math.min(Math.max(newWidth, minWidth), maxWidth);
      resizing.style.width = `${newWidth}px`;
      resizing.dataset.size = newWidth / 4;
      let thickness = clamp(resizing.dataset.size, 4, 30);
      resizing.dataset.size = thickness;
      resizing.textContent = `SS Shutter\n${thickness.toFixed(1)} mm`;
    }

    const tip = document.createElement('div');
    tip.className = 'tooltip';
    if (type === 'gap' || type === 'layer') {
      tip.textContent = `Size: ${Math.round(resizing.dataset.size)} mm`;
    } else {
      tip.textContent = `Thickness: ${resizing.dataset.size.toFixed(1)} mm`;
    }
    resizing.appendChild(tip);
  }

  function stopResize(e) {
    if (!resizing) return;
    document.removeEventListener('mousemove', doResize);
    document.removeEventListener('mouseup', stopResize);
    resizing = null;
  }

  function buildDefenseLine() {
    const line = document.getElementById('defenseLine');
    line.innerHTML = '';

    const shutterCount = clamp(parseInt(document.getElementById('shutterCount').value, 10) || 0, 0, 5);
    const shutterThickness = clamp(parseFloat(document.getElementById('shutterThickness').value) || 8, 4, 30);
    const shutterGapMm = clamp(parseFloat(document.getElementById('shutterGap').value) || 500, 50, 2500);

    const airGapMm = clamp(parseFloat(document.getElementById('airGap').value) || 1000, 500, 2500);
    const gap12Mm = clamp(parseFloat(document.getElementById('gap12').value) || 2000, 50, 5000);
    const gap23Mm = clamp(parseFloat(document.getElementById('gap23').value) || 2000, 50, 5000);

    const showSpaces = document.getElementById('showShutterSpaces').checked;

    for (let i = 0; i < shutterCount; i++) {
      const shutterSeg = createSegment({
        id: `shutter-${i}`,
        type: 'shutter',
        label: `SS Shutter\n${shutterThickness} mm`,
        size: shutterThickness,
        tooltip: `Single SS shutter\nThickness: ${shutterThickness.toFixed(1)} mm`,
        draggable: true,
        resizable: true
      });
      shutterSeg.dataset.size = shutterThickness;
      shutterSeg.addEventListener('dragstart', onDragStart);
      shutterSeg.addEventListener('dragend', onDragEnd);
      line.appendChild(shutterSeg);

      if (showSpaces && i < shutterCount - 1) {
        const gapSeg = createSegment({
          id: `shutter-gap-${i}`,
          type: 'gap',
          label: `${shutterGapMm} mm`,
          size: shutterGapMm,
          tooltip: `Space between shutters\n${shutterGapMm.toFixed(0)} mm`,
          draggable: false,
          resizable: true
        });
        gapSeg.dataset.size = shutterGapMm;
        line.appendChild(gapSeg);
      }
    }

    if (shutterCount > 0) {
      const gapBeforeLayer1 = createSegment({
        id: 'gap-before-layer1',
        type: 'gap',
        label: 'Gap to Layer 1',
        size: 500,
        tooltip: 'Gap between shutters and Layer 1 (fixed 500mm)',
        draggable: false,
        resizable: true
      });
      gapBeforeLayer1.dataset.size = 500;
      line.appendChild(gapBeforeLayer1);
    }

    // Layer 1 composite blocks
    line.appendChild(createSegment({
      id: 'layer1-ss1',
      type: 'shutter',
      label: '8mm SS',
      size: 8,
      tooltip: 'Layer 1 - First 8mm SS sheet',
      draggable: false,
      resizable: true
    }));
    line.lastChild.dataset.size = 8;
    line.appendChild(createSegment({
      id: 'layer1-gap',
      type: 'gap',
      label: `${airGapMm} mm`,
      size: airGapMm,
      tooltip: `Layer 1 - Internal air gap ${airGapMm} mm`,
      draggable: false,
      resizable: true
    }));
    line.lastChild.dataset.size = airGapMm;
    line.appendChild(createSegment({
      id: 'layer1-ss2',
      type: 'shutter',
      label: '8mm SS',
      size: 8,
      tooltip: 'Layer 1 - Second 8mm SS sheet',
      draggable: false,
      resizable: true
    }));
    line.lastChild.dataset.size = 8;

    // Gap between Layer 1 and 2
    line.appendChild(createSegment({
      id: 'gap12',
      type: 'gap',
      label: `${gap12Mm} mm`,
      size: gap12Mm,
      tooltip: `Space between Layer 1 and Layer 2: ${gap12Mm} mm`,
      draggable: false,
      resizable: true
    }));

    // Layer 2 composite blocks
    line.appendChild(createSegment({
      id: 'layer2-ss1',
      type: 'shutter',
      label: '8mm SS',
      size: 8,
      tooltip: 'Layer 2 - First 8mm SS sheet',
      draggable: false,
      resizable: true
    }));
    line.lastChild.dataset.size = 8;
    line.appendChild(createSegment({
      id: 'layer2-gap',
      type: 'gap',
      label: `${airGapMm} mm`,
      size: airGapMm,
      tooltip: `Layer 2 - Internal air gap ${airGapMm} mm`,
      draggable: false,
      resizable: true
    }));
    line.lastChild.dataset.size = airGapMm;
    line.appendChild(createSegment({
      id: 'layer2-ss2',
      type: 'shutter',
      label: '8mm SS',
      size: 8,
      tooltip: 'Layer 2 - Second 8mm SS sheet',
      draggable: false,
      resizable: true
    }));
    line.lastChild.dataset.size = 8;

    // Gap between Layer 2 and 3
    line.appendChild(createSegment({
      id: 'gap23',
      type: 'gap',
      label: `${gap23Mm} mm`,
      size: gap23Mm,
      tooltip: `Space between Layer 2 and Layer 3: ${gap23Mm} mm`,
      draggable: false,
      resizable: true
    }));

    // Layer 3 composite blocks
    line.appendChild(createSegment({
      id: 'layer3-ss1',
      type: 'shutter',
      label: '8mm SS',
      size: 8,
      tooltip: 'Layer 3 - First 8mm SS sheet',
      draggable: false,
      resizable: true
    }));
    line.lastChild.dataset.size = 8;
    line.appendChild(createSegment({
      id: 'layer3-gap',
      type: 'gap',
      label: `${airGapMm} mm`,
      size: airGapMm,
      tooltip: `Layer 3 - Internal air gap ${airGapMm} mm`,
      draggable: false,
      resizable: true
    }));
    line.lastChild.dataset.size = airGapMm;
    line.appendChild(createSegment({
      id: 'layer3-ss2',
      type: 'shutter',
      label: '8mm SS',
      size: 8,
      tooltip: 'Layer 3 - Second 8mm SS sheet',
      draggable: false,
      resizable: true
    }));
    line.lastChild.dataset.size = 8;

    // Add drag event listeners for shutters only
    const shutters = line.querySelectorAll('.segment.shutter[draggable="true"]');
    shutters.forEach(shutter => {
      shutter.addEventListener('dragstart', onDragStart);
      shutter.addEventListener('dragend', onDragEnd);
    });

    line.addEventListener('dragover', onDragOver);
  }

  window.addEventListener('load', buildDefenseLine);
  document.getElementById('runBtn').addEventListener('click', buildDefenseLine);
</script>

</body>
</html>
