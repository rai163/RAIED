        }

        // ========== SHUTTER / DOME MATERIALS ==========
        const steelShutter = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.99, roughness: 0.02, emissive: 0x444444 });
        const pillarMat2   = new THREE.MeshStandardMaterial({ color: 0xd0b080, metalness: 0.88, roughness: 0.22 });

        let moduleGroups = {};
        let globalDomeTarget = 0.0;
        const SHUTTER_CLOSE_DURATION = 5000;

        let moduleFont = null;

        function updateModuleTopShutters(moduleName, factor) {
            const data = moduleGroups[moduleName];
            if (!data) return;
            data.topExt = factor;
            const topY = data.topY;
            data.topShutters.forEach(s => {
                const { retractedZ, extendedZ, offsetY } = s.userData;
                s.position.z = retractedZ + (extendedZ - retractedZ) * factor;
                s.position.y = topY + 0.1 + offsetY * (1 - factor);
            });
        }
        function updateModuleDoors(moduleName, factor) {
            const data = moduleGroups[moduleName];
            if (!data) return;
            data.doorExt = factor;
            data.doors.forEach(d => {
                if (d.axis === 'x') d.obj.position.x = d.open + (d.closed - d.open) * factor;
                else d.obj.position.z = d.open + (d.closed - d.open) * factor;
            });
        }
        function animateModuleShutters(moduleName, targetFactor, duration = SHUTTER_CLOSE_DURATION) {
            const data = moduleGroups[moduleName];
            if (!data) return;
            const startFactor = data.topExt;
            if (Math.abs(startFactor - targetFactor) < 0.01) return;
            const startTime = performance.now();
            function step(now) {
                const elapsed = now - startTime;
                const t = Math.min(1, elapsed / duration);
                updateModuleTopShutters(moduleName, startFactor + (targetFactor - startFactor) * t);
                updateModuleDoors(moduleName, startFactor + (targetFactor - startFactor) * t);
                if (t < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }
        function closeAllDomes() { for (let name in moduleGroups) animateModuleShutters(name, 1.0); globalDomeTarget = 1.0; }
        function openAllDomes() { for (let name in moduleGroups) animateModuleShutters(name, 0.0); globalDomeTarget = 0.0; }
        function playShutterSound() { try { const audio = new Audio('Shutters are closing or openning.mp3'); audio.volume = 0.3; audio.play(); } catch(e) {} }

        function rebuildModule(name) {
            const cfg = moduleConfig[name];
            if (!cfg) return;
            const { x, z, color, domeW, domeD, domeH } = cfg;
            if (moduleGroups[name]) { scene.remove(moduleGroups[name].group); }
            const group = new THREE.Group();
            const baseY = -0.5, topY = baseY + domeH;
            const innerGroup = new THREE.Group();
            if      (name === 'FCCU')    innerGroup.add(buildFCCUModel());
            else if (name === 'HHU')     innerGroup.add(buildHHUModel());
            else if (name === 'CDU')     innerGroup.add(buildCDUModel());
            else if (name === 'VDU')     innerGroup.add(buildVDUModel());
            else if (name === 'CRU')     innerGroup.add(buildCRUModel());
            else if (name === 'LPG')     innerGroup.add(buildLPGModel());
            else if (name === 'STORAGE') innerGroup.add(buildSTORAGEModel());
            else if (name === 'DCS')     innerGroup.add(buildDCSModel());
            else if (name === 'SRU')     innerGroup.add(buildSRUModel());
            else if (name === 'PPU')     innerGroup.add(buildPPUModel());
            else if (name === 'RS')      innerGroup.add(buildRSModel());
            innerGroup.position.set(0, baseY + 0.01, 0);
            group.add(innerGroup);

            const halfW = domeW / 2, halfD = domeD / 2, pillarHeight = domeH;
            [[-halfW,-halfD],[halfW,-halfD],[halfW,halfD],[-halfW,halfD]].forEach(([px,pz]) => {
                const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.8, pillarHeight, 0.8), pillarMat2);
                pillar.position.set(px, baseY + pillarHeight/2, pz); pillar.castShadow = true; group.add(pillar);
            });

            // ---------- DOME BEAMS ----------
            const beamHeight = 1.0;
            const beamDepth  = 0.8;
            const beamColor = landConfig.domeBeamColor || 0xff8844;
            const beamMat = new THREE.MeshStandardMaterial({
                color: beamColor,
                metalness: 0.6,
                roughness: 0.2,
                emissive: beamColor,
                emissiveIntensity: 0.8
            });
            const beamInset = 0.0;
            const southBeam = new THREE.Mesh(new THREE.BoxGeometry(domeW, beamHeight, beamDepth), beamMat);
            southBeam.position.set(0, topY, -halfD + beamInset);
            southBeam.castShadow = true; group.add(southBeam);
            const eastBeam  = new THREE.Mesh(new THREE.BoxGeometry(beamDepth, beamHeight, domeD), beamMat);
            eastBeam.position.set(halfW - beamInset, topY, 0);
            eastBeam.castShadow = true; group.add(eastBeam);
            const northBeam = new THREE.Mesh(new THREE.BoxGeometry(domeW, beamHeight, beamDepth), beamMat);
            northBeam.position.set(0, topY, halfD - beamInset);
            northBeam.castShadow = true; group.add(northBeam);
            const westBeam  = new THREE.Mesh(new THREE.BoxGeometry(beamDepth, beamHeight, domeD), beamMat);
            westBeam.position.set(-halfW + beamInset, topY, 0);
            westBeam.castShadow = true; group.add(westBeam);

            const HALF_SIZE_W = domeW / 2, HALF_SIZE_D = domeD / 2, PILLAR_H = domeH, GROUND_Y = baseY, TOP_Y = GROUND_Y + PILLAR_H;

            // ---------- CROSS BEAMS ----------
            const crossBeamColor = landConfig.crossBeamColor || 0x444444;
            const beadingMat = new THREE.MeshStandardMaterial({
                color: crossBeamColor,
                metalness: 0.8,
                roughness: 0.3,
                emissive: crossBeamColor,
                emissiveIntensity: 0.6
            });
            const beadingXPositions = [-4.0, -1.3, 1.3, 4.0].map(x => x * (domeW / 13.5));
            beadingXPositions.forEach(xPos => {
                const beadingBar = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, domeD), beadingMat);
                beadingBar.position.set(xPos, TOP_Y + 0.2, 0);
                beadingBar.castShadow = true;
                group.add(beadingBar);
            });

            const connectorMat = new THREE.MeshStandardMaterial({ color:0xfcfcfc, metalness:0.99, roughness:0.03 });
            const hardwareMat = new THREE.MeshStandardMaterial({ color:0xffffff, metalness:0.99, roughness:0.02, emissive:0x222222 });
            [{x:-HALF_SIZE_W,z:-HALF_SIZE_D},{x:HALF_SIZE_W,z:-HALF_SIZE_D},{x:HALF_SIZE_W,z:HALF_SIZE_D},{x:-HALF_SIZE_W,z:HALF_SIZE_D}].forEach(pos => {
                const connector = new THREE.Mesh(new THREE.BoxGeometry(0.75,0.75,0.75), connectorMat); connector.position.set(pos.x,TOP_Y,pos.z); group.add(connector);
                const screw = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.06,6), hardwareMat); screw.position.set(pos.x,TOP_Y+0.14,pos.z); group.add(screw);
            });
            const midPoints = [{x:0,z:-HALF_SIZE_D},{x:HALF_SIZE_W,z:0},{x:0,z:HALF_SIZE_D},{x:-HALF_SIZE_W,z:0}];
            const bracketMat = new THREE.MeshStandardMaterial({ color:0xf0f0f4, metalness:0.98, roughness:0.08 });
            midPoints.forEach(mp => { const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.14,0.4), bracketMat); bracket.position.set(mp.x,TOP_Y+0.1,mp.z); group.add(bracket); const boltSmall = new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8), hardwareMat); boltSmall.position.set(mp.x,TOP_Y+0.17,mp.z); group.add(boltSmall); });

            const numTracks = 5, trackWidth = domeW / numTracks, shutterThickness = 0.016, sectionCount = 4, sectionLength = domeD / sectionCount;
            const shutterMat = new THREE.MeshStandardMaterial({ color:0xffffff, metalness:0.5, roughness:0.2 });
            const topShutters = [];
            for (let t=0; t<numTracks; t++) { const cx = -HALF_SIZE_W + (t+0.5)*trackWidth; for (let i=0; i<sectionCount; i++) { const startZ = -HALF_SIZE_D + i*sectionLength, centerZ = startZ+sectionLength/2, retractedZ = -HALF_SIZE_D, extendedZ = centerZ; const shutter = new THREE.Mesh(new THREE.BoxGeometry(trackWidth,shutterThickness,sectionLength), shutterMat); shutter.position.set(cx, TOP_Y+0.1+i*0.018, retractedZ); shutter.castShadow = true; shutter.userData = {retractedZ,extendedZ,offsetY:i*0.018}; group.add(shutter); topShutters.push(shutter); } }

            // ---------- DOORS (independent open / closed overlap) ----------
            const doorHeight = PILLAR_H - 0.5;
            const doorY = GROUND_Y + doorHeight / 2;
            const doorMat = new THREE.MeshStandardMaterial({ color:0xffffff, metalness:0.99, roughness:0.02, emissive:0x333333 });
            const pillarHalf = 0.4, innerEdgeX = HALF_SIZE_W - pillarHalf, innerEdgeZ = HALF_SIZE_D - pillarHalf;
            const centreX=0, centreZ=0;

            const openOverlap   = landConfig.openDoorOverlap   || 0;
            const closedOverlap = landConfig.closedDoorOverlap || 0;

            const westClosedX  = -innerEdgeX + (centreX - (-innerEdgeX)) * 0.50 - closedOverlap;
            const eastClosedX  =  innerEdgeX + (centreX - innerEdgeX) * 0.50 + closedOverlap;
            const southClosedZ = -innerEdgeZ + (centreZ - (-innerEdgeZ)) * 0.50 - closedOverlap;
            const northClosedZ =  innerEdgeZ + (centreZ - innerEdgeZ) * 0.50 + closedOverlap;

            const pillarInnerWest  = -halfW + 0.4;
            const pillarInnerEast  =  halfW - 0.4;
            const pillarInnerSouth = -halfD + 0.4;
            const pillarInnerNorth =  halfD - 0.4;

            const halfDoorWidthX = domeW / 2;
            const halfDoorWidthZ = domeD / 2;

            const openWest  = pillarInnerWest - halfDoorWidthX - openOverlap;
            const openEast  = pillarInnerEast + halfDoorWidthX + openOverlap;
            const openSouth = pillarInnerSouth - halfDoorWidthZ - openOverlap;
            const openNorth = pillarInnerNorth + halfDoorWidthZ + openOverlap;

            function addHalfDoor(axis, openC, closedC, fixed, rotY, doorWidth) {
                const door = new THREE.Mesh(new THREE.BoxGeometry(doorWidth, doorHeight, 0.08), doorMat);
                door.castShadow = true;
                door.rotation.y = rotY;
                if (axis === 'x') door.position.set(openC, doorY, fixed);
                else door.position.set(fixed, doorY, openC);
                group.add(door);
                return { obj: door, axis, open: openC, closed: closedC };
            }

            const doors = [];
            doors.push(addHalfDoor('x', openWest,  westClosedX,  -HALF_SIZE_D, 0, halfDoorWidthX));
            doors.push(addHalfDoor('x', openEast,  eastClosedX,  -HALF_SIZE_D, 0, halfDoorWidthX));
            doors.push(addHalfDoor('z', openSouth, southClosedZ, HALF_SIZE_W, Math.PI/2, halfDoorWidthZ));
            doors.push(addHalfDoor('z', openNorth, northClosedZ, HALF_SIZE_W, Math.PI/2, halfDoorWidthZ));
            doors.push(addHalfDoor('x', openEast,  eastClosedX,  HALF_SIZE_D, Math.PI, halfDoorWidthX));
            doors.push(addHalfDoor('x', openWest,  westClosedX,  HALF_SIZE_D, Math.PI, halfDoorWidthX));
            doors.push(addHalfDoor('z', openNorth, northClosedZ, -HALF_SIZE_W, -Math.PI/2, halfDoorWidthZ));
            doors.push(addHalfDoor('z', openSouth, southClosedZ, -HALF_SIZE_W, -Math.PI/2, halfDoorWidthZ));

            // Gap‑free closing for select modules
            if (name === 'CDU' || name === 'VDU' || name === 'RS' || name === 'LPG' || name === 'STORAGE') {
                const pillarInner = 0.4;
                doors.forEach(d => {
                    if (d.axis === 'x') {
                        const sign = d.closed < 0 ? -1 : 1;
                        d.closed = sign * (halfW / 2);
                        d.open   = sign * (halfW - pillarInner);
                    } else {
                        const sign = d.closed < 0 ? -1 : 1;
                        d.closed = sign * (halfD / 2);
                        d.open   = sign * (halfD - pillarInner);
                    }
                    if (d.axis === 'x') d.obj.position.x = d.open;
                    else d.obj.position.z = d.open;
                });
            }

            group.position.set(x, 0, z);
            scene.add(group);

            // ★ 3D label using label config
            const label3D = createModuleLabel3D(name, name);
            if (label3D) {
                group.add(label3D);
            }

            moduleGroups[name] = { group, topShutters, doors, topExt:0, doorExt:0, topY:TOP_Y };
            updateModuleTopShutters(name, globalDomeTarget);
            updateModuleDoors(name, globalDomeTarget);
        }

        function rebuildAllModules() { for (let n in moduleConfig) rebuildModule(n); }
        function removeModule3D(name) { if(moduleGroups[name]) { scene.remove(moduleGroups[name].group); delete moduleGroups[name]; } }

        // ========== DYNAMIC LAND SIZING ==========
        function getFenceBounds() {
            let minX=Infinity, maxX=-Infinity, minZ=Infinity, maxZ=-Infinity;
            fencesConfig.forEach(f=>{ const half=f.length/2, rad=(f.rotation||0)*Math.PI/180; if(Math.abs(Math.sin(rad))<0.01){ minX=Math.min(minX,f.x-half,f.x+half); maxX=Math.max(maxX,f.x-half,f.x+half); minZ=Math.min(minZ,f.z-0.1,f.z+0.1); maxZ=Math.max(maxZ,f.z-0.1,f.z+0.1); } else if(Math.abs(Math.cos(rad))<0.01){ minZ=Math.min(minZ,f.z-half,f.z+half); maxZ=Math.max(maxZ,f.z-half,f.z+half); minX=Math.min(minX,f.x-0.1,f.x+0.1); maxX=Math.max(maxX,f.x-0.1,f.x+0.1); } else { minX=Math.min(minX,f.x-half); maxX=Math.max(maxX,f.x+half); minZ=Math.min(minZ,f.z-half); maxZ=Math.max(maxZ,f.z+half); } });
            return {minX,maxX,minZ,maxZ};
        }
        let groundPlane, externalPlane, gridHelper;
        function rebuildLand() {
            if(groundPlane) scene.remove(groundPlane); if(externalPlane) scene.remove(externalPlane); if(gridHelper) scene.remove(gridHelper);
            const b=getFenceBounds(); const minX=b.minX-marginWest, maxX=b.maxX+marginEast, minZ=b.minZ-marginSouth, maxZ=b.maxZ+marginNorth;
            const sizeX=maxX-minX, sizeZ=maxZ-minZ, cx=(minX+maxX)/2, cz=(minZ+maxZ)/2;
            groundPlane = new THREE.Mesh(new THREE.PlaneGeometry(sizeX,sizeZ), new THREE.MeshStandardMaterial({color:landConfig.groundColor,roughness:0.7}));
            groundPlane.rotation.x=-Math.PI/2; groundPlane.position.set(cx,-0.5,cz); groundPlane.receiveShadow=true; scene.add(groundPlane);
            externalPlane = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(sizeX,sizeZ)+200,Math.max(sizeX,sizeZ)+200), new THREE.MeshStandardMaterial({color:landConfig.externalColor,roughness:0.8}));
            externalPlane.rotation.x=-Math.PI/2; externalPlane.position.set(cx,-0.55,cz); externalPlane.receiveShadow=true; externalPlane.visible=showExternalPlane; scene.add(externalPlane);
            gridHelper = new THREE.GridHelper(sizeX, Math.floor(sizeX/10), landConfig.gridColor, 0x6688aa);
            gridHelper.position.set(cx,-0.4,cz); gridHelper.material.transparent=true; gridHelper.material.opacity=landConfig.gridOpacity; scene.add(gridHelper);
        }

        // ========== REBUILD FUNCTIONS ==========
        let gateObjects=[];
        function rebuildGates() {
            gateObjects.forEach(g=>scene.remove(g)); gateObjects=[];
            function addGate(cfg){ const g=new THREE.Group(); const pMat=new THREE.MeshStandardMaterial({color:0x7f8c8d}); const l=new THREE.Mesh(new THREE.BoxGeometry(cfg.pillarWidth,cfg.height,1.5),pMat); l.position.set(-cfg.width/2,cfg.height/2,0); const r=new THREE.Mesh(new THREE.BoxGeometry(cfg.pillarWidth,cfg.height,1.5),pMat); r.position.set(cfg.width/2,cfg.height/2,0); const t=new THREE.Mesh(new THREE.BoxGeometry(cfg.width+0.4,0.5,1.2),new THREE.MeshStandardMaterial({color:cfg.topColor,metalness:0.8})); t.position.set(0,cfg.height-0.2,0); g.add(l,r,t); g.position.set(cfg.x,cfg.y||0,cfg.z); scene.add(g); gateObjects.push(g); }

        let staffParkingGroup = null;
        function rebuildStaffParking() {
            if (staffParkingGroup) scene.remove(staffParkingGroup);
            staffParkingGroup = new THREE.Group();
            const sp = parkingConfig.staffCarPark; if (!sp) return;
            const landColor = sp.landColor !== undefined ? sp.landColor : 0xcccccc;
            const lotMat = new THREE.MeshStandardMaterial({ color: landColor, roughness: 0.7 });
            const lot = new THREE.Mesh(new THREE.BoxGeometry(sp.width, 0.2, sp.depth), lotMat); lot.position.y = -0.45; lot.receiveShadow = true; staffParkingGroup.add(lot);
            const laneWidth = 6.0;
            const dashMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            for (let ix = -sp.width/2 + 2; ix < sp.width/2 - 2; ix += 2.5) { const dash = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 0.15), dashMat); dash.position.set(ix, -0.38, 0); staffParkingGroup.add(dash); }
            const rowSpacing = 5.5, colSpacing = 5.5;
            const firstRowZ = laneWidth/2 + 2.5, firstColX = -sp.width/2 + 3.0;
            function addCar(lx, lz, rotY, color = 0xfacc15) { const car = createCarModel(color); car.position.set(lx, -0.25, lz); car.rotation.y = rotY; staffParkingGroup.add(car); }
            const skipSpots = [{ col:4, row:2, side:'north' }, { col:4, row:2, side:'south' }];

                                    STORAGE: '7 RAIED - Storage Tank - Standard 20K Ton Oil Storage Tank/storage.html',
                                    DCS:     '8 RAIED - DCS Building - Distributed Control System - Control Room/dcs.html',
                                    SRU:     '9 RAIED - SRU - Sulfur Recovery Unit/sru.html',
                                    PPU:     '10 RAIED - PPU - Power Plant Unit - Electrical Substation/ppu.html',
                                    RS:      '11 RAIED - RSU - Refinery Shelter Unit - Safe Building/rs.html'
                                };
                                const url = urlMap[baseKey];
                                if (url) window.location.href = url;
                            }
                        }
                    }
                }
            }
        });

// ===== RELIABLE RESIZE / ROTATE FIX =====
function handleResize() {
    requestAnimationFrame(() => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        labelRenderer.setSize(w, h);
        labelRenderer.domElement.style.width  = w + 'px';
        labelRenderer.domElement.style.height = h + 'px';
        renderer.domElement.style.width  = '100%';
        renderer.domElement.style.height = '100%';
    });
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => {
    setTimeout(handleResize, 100);
});

// ===== UNIFIED TAP NAVIGATION =====
let tapStartTime = 0;
let tapStartPos = { x: 0, y: 0 };
window.addEventListener('pointerdown', (e) => {
    tapStartTime = Date.now();
    tapStartPos.x = e.clientX;
    tapStartPos.y = e.clientY;
});
window.addEventListener('pointerup', (e) => {
    const elapsed = Date.now() - tapStartTime;
    const dx = e.clientX - tapStartPos.x;
    const dy = e.clientY - tapStartPos.y;
    const moved = Math.hypot(dx, dy);
    if (elapsed < 300 && moved < 5) {
        mouse.x = (e.clientX / renderer.domElement.clientWidth) * 2 - 1;
        mouse.y = -(e.clientY / renderer.domElement.clientHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const groups = Object.values(moduleGroups).map(g => g.group);
        const hits = raycaster.intersectObjects(groups, true);
        if (hits.length) {
            let hit = hits[0].object;
            while (hit && !groups.includes(hit)) hit = hit.parent;
            if (hit) {
                const name = Object.keys(moduleGroups).find(k => moduleGroups[k].group === hit);
                if (name) {
                    const baseKey = name.replace(/_\d+$/, '');
                    const urlMap = {
                        FCCU:    '1 RAIED - FCCU - Fluid Catalytic Cracking Unit/fccu.html',
                        HHU:     '2 RAIED - HHU - Hydrocracker - Hydroprocessing Unit/hhu.html',
                        CDU:     '3 RAIED - CDU - Crude Distillation Unit/cdu.html',
                        VDU:     '4 RAIED - VDU - Vacuum Distillation Unit/vdu.html',
                        CRU:     '5 RAIED - CRU - Catalytic Reformer Unit/cru.html',
                        LPG:     '6 RAIED - LPG Tank - Liquefied Petroleum Gas/lpg.html',
                        STORAGE: '7 RAIED - Storage Tank - Standard 20K Ton Oil Storage Tank/storage.html',
                        DCS:     '8 RAIED - DCS Building - Distributed Control System - Control Room/dcs.html',
                        SRU:     '9 RAIED - SRU - Sulfur Recovery Unit/sru.html',
                        PPU:     '10 RAIED - PPU - Power Plant Unit - Electrical Substation/ppu.html',
                        RS:      '11 RAIED - RSU - Refinery Shelter Unit - Safe Building/rs.html'
                    };
                    const url = urlMap[baseKey];
                    if (url) window.location.href = url;
                }
            }
        }
    }
});
